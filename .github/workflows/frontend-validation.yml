name: Frontend validation

on:
  push:
    branches: [main, feature/clean-auto-paper-dashboard]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate safe Cloudflare deploy and D1 setup scripts
        run: node --check scripts/deploy-verified-production.mjs && node --check scripts/setup-paper-cloud.mjs
      - name: Typecheck and build
        run: npm run build
      - name: Bundle Cloudflare Worker API (DART paging and discovery)
        run: npx esbuild worker/src/index.ts --bundle --format=esm --platform=browser --target=es2022 --outfile=/tmp/kb-worker-ci.mjs
      - name: Signal and trading-status regression checks
        run: node --experimental-strip-types --test tests/tradeSignals.test.mjs tests/autoStatus.test.mjs tests/paperEngineCheck.test.mjs tests/scanReview.test.mjs tests/trialExit.test.mjs tests/autoWatch.test.mjs tests/maxPositions.test.mjs tests/marketCatalysts.test.mjs tests/kbOAuthReuse.test.mjs tests/tradingAnalytics.test.mjs tests/screeningHistory.test.mjs tests/kbQuoteBatch.test.mjs tests/paperCloudBackup.test.mjs tests/paperTradeLease.test.mjs tests/cloudAutoSync.test.mjs tests/serverPaper.test.mjs tests/serverPaperMonitor.test.mjs tests/notifications.test.mjs tests/notificationPreferences.test.mjs tests/deploySmoke.test.mjs tests/liveTrial.test.mjs tests/deploymentStatus.test.mjs tests/liveOrderJournal.test.mjs tests/kbOrderContract.test.mjs tests/kbOrderSubmit.test.mjs tests/liveRiskPreflight.test.mjs tests/liveTrialPreflight.test.mjs
