name: Frontend validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Signal and trading-status regression checks
        run: node --experimental-strip-types --test tests/tradeSignals.test.mjs tests/autoStatus.test.mjs tests/paperEngineCheck.test.mjs tests/scanReview.test.mjs
