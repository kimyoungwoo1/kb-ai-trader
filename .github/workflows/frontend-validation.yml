name: Frontend validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Bundle Cloudflare Worker API (DART paging and discovery)
        run: npx esbuild worker/src/index.ts --bundle --format=esm --platform=browser --target=es2022 --outfile=/tmp/kb-worker-ci.mjs
      - name: Signal and trading-status regression checks
        run: node --experimental-strip-types --test tests/tradeSignals.test.mjs tests/autoStatus.test.mjs tests/paperEngineCheck.test.mjs tests/scanReview.test.mjs tests/trialExit.test.mjs tests/autoWatch.test.mjs tests/maxPositions.test.mjs tests/marketCatalysts.test.mjs tests/kbOAuthReuse.test.mjs tests/tradingAnalytics.test.mjs
